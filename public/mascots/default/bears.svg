    <circle cx="56" cy="64" r="33" fill="#0f6b3d"/>
    <circle cx="184" cy="64" r="33" fill="#0f6b3d"/>
    <circle cx="56" cy="64" r="15" fill="#14181f"/>
    <circle cx="184" cy="64" r="15" fill="#14181f"/>
